{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logged Out | Rugby Direct SA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {

            min-height: 100vh;

            background:
            linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

        }

        .logout-card {

            background: white;

            width: 100%;
            max-width: 500px;

            padding: 50px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
            0 15px 35px rgba(0,0,0,.3);

        }

        .logout-icon {

            font-size: 5rem;

        }

        h1 {

            margin-top: 15px;
            font-weight: bold;

        }

        p {

            color: #6c757d;
            margin-bottom: 30px;

        }

    </style>

</head>

<body>

    <div class="logout-card">

        <div class="logout-icon">
            ✅
        </div>

        <h1>
            Successfully Logged Out
        </h1>

        <p>
            Thank you for visiting Rugby Direct SA.
            You have been safely logged out of your account.
        </p>

        <a href="{% url 'home' %}"
           class="btn btn-danger btn-lg">

            Return Home

        </a>

        <a href="{% url 'login' %}"
           class="btn btn-outline-dark btn-lg ms-2">

            Login Again

        </a>

    </div>

</body>

</html>
