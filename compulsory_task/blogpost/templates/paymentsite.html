{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Rugby Direct SA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {

            min-height: 100vh;

            background:
            linear-gradient(
                135deg,
                #006400,
                #228B22,
                #FFD700
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .checkout-card {

            background: white;

            width: 100%;
            max-width: 650px;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
            0 15px 35px rgba(0,0,0,.3);

        }

        .logo {

            width: 120px;
            display: block;
            margin: auto auto 20px auto;

        }

        .title {

            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;

        }

        .subtitle {

            text-align: center;
            color: grey;
            margin-bottom: 30px;

        }

    </style>

</head>

<body>

<div class="checkout-card">

    <img
        src="{% static 'images/rugbylogo.png' %}"
        class="logo"
        alt="Rugby Direct SA Logo">

    <h2 class="title">
        Rugby Direct SA Checkout
    </h2>

    <p class="subtitle">
        Complete your purchase securely
    </p>

    <form>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    First Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter first name"
                    required>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Surname
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter surname"
                    required>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Card Holder Name
            </label>

            <input
                type="text"
                class="form-control"
                placeholder="Name on card"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Card Number
            </label>

            <input
                type="text"
                class="form-control"
                placeholder="1234 5678 9012 3456"
                required>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Expiry Date
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="MM/YY"
                    required>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    CVV
                </label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="123"
                    required>

            </div>

        </div>

        <div class="d-grid gap-2 mt-4">

            <a href="{% url 'purchase_success' %}"
               class="btn btn-success btn-lg">

                Complete Purchase

            </a>

            <a href="{% url 'post' %}"
               class="btn btn-outline-secondary">

                Continue Shopping

            </a>

            <span class="text-light me-3">

            Welcome, {{ user.username }}

            </span>

            <a href="{% url 'cart' %}"
                class="btn btn-success me-2">

                🛒 Cart ({{ cart_count }})

            </a>

        </div>

    </form>

</div>

</body>

</html>
