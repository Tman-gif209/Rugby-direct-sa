{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Purchase Successful</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {

            min-height: 100vh;

            background:
            linear-gradient(
                135deg,
                #006400,
                #228B22,
                #FFD700
            );

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .card-box {

            background: white;

            padding: 50px;

            border-radius: 20px;

            text-align: center;

            width: 100%;
            max-width: 600px;

            box-shadow:
            0 15px 30px rgba(0,0,0,.3);

        }

        .tick {

            font-size: 5rem;

        }

    </style>

</head>

<body>

<div class="card-box">

    <div class="tick">
        ✅
    </div>

   <h1>

    ✅ Purchase Successful

</h1>

<hr>

<h4>

    Order Number:
    #1001

</h4>

<h4>

    Items Purchased:
    {{ item_count }}

</h4>

<h4>

    Total Paid:
    R{{ total }}

</h4>

<p>

    Thank you for choosing
    Rugby Direct SA.

</p>

<a href="{% url 'logout_page' %}"
   class="btn btn-danger mt-3">

    Logout

</a>

</div>

</body>

</html>
